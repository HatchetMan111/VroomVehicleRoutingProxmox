# vroom-express Konfiguration (wird von container/setup.sh deployed).
# Der Port wird per sed auf API_PORT gesetzt; logdir bleibt Upstream-Default '..'
# (Logpfad kommt zur Laufzeit aus Env VROOM_LOG=/var/log/vroom in vroom-api.service,
#  weil config.js __dirname + logdir konkateniert und absolute Pfade dort brechen).
# Router bleibt osrm-Default; Matrix-Anfragen funktionieren OHNE Routing-Server lokal.
cliArgs:
  geometry: false
  planmode: false
  threads: 4
  explore: 5
  limit: '1mb'
  logdir: '..'
  logsize: '100M'
  maxlocations: 1000
  maxvehicles: 200
  override: ['c', 'g', 'l', 't', 'x']
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 300000
  baseurl: '/'
routingServers:
  osrm:
    car:
      host: '0.0.0.0'
      port: '5000'
    bike:
      host: '0.0.0.0'
      port: '5001'
    foot:
      host: '0.0.0.0'
      port: '5002'
  ors:
    driving-car:
      host: '0.0.0.0/ors/v2'
      port: '8080'
  valhalla:
    auto:
      host: '0.0.0.0'
      port: '8002'
